brand_id: health_co
brand_name: "HealthCo Wellness"

severity_tiers:
  instant_reject:
    - hate_speech
    - explicit_sexual
    - illegal_activity
    - unverified_health_claims
    - supplement_promotion
  flag_for_review:
    - political_content
    - controversial_topic
    - competitor_mention
    - before_after_imagery
  acceptable:
    - fitness
    - healthy_eating
    - wellness_lifestyle
    - mental_health_positive

thresholds:
  min_approve_score: 0.90
  auto_reject_below: 0.25
  flag_band: [0.25, 0.90]

creator_history:
  violation_lookback_days: 365
  max_violations_before_block: 1

audience:
  min_brand_affinity_pct: 50
  max_bot_pct: 10

rules:
  - id: H001
    name: "No unverified health claims"
    type: text
    keywords: ["cure", "miracle", "guaranteed results", "clinically proven"]
    severity: instant_reject
    description: "Content must not make unverified health or medical claims"
  - id: H002
    name: "No supplement promotion"
    type: text_and_image
    keywords: ["supplement", "fat burner", "detox tea", "weight loss pill"]
    severity: instant_reject
  - id: H003
    name: "No before/after transformation imagery"
    type: image
    signal: before_after_imagery
    severity: flag_for_review
    description: "Before/after body transformation images require review — body image sensitivity"
  - id: H004
    name: "Audience quality — stricter"
    type: profile
    check: "bot_pct <= max_bot_pct AND brand_affinity_pct >= min_brand_affinity_pct"
    severity: flag_for_review
  - id: H005
    name: "No competitor mentions"
    type: text_and_image
    keywords: ["FitLife", "WellnessPlus", "VitaCore"]
    severity: flag_for_review
  - id: H006
    name: "Alcohol permitted"
    type: text_and_image
    signal: alcohol_visible
    severity: acceptable
    description: "HealthCo permits moderate alcohol references — wine with dinner, etc."
