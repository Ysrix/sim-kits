portco_id: portco_002
name: "BetaServices LLC"
gl: "Xero"
chart_of_accounts: "inputs/portco_002_coa.csv"
known_vendors: "inputs/portco_002_vendors.csv"
approval_rules:
  - name: auto_approve_small_known
    condition: "amount < 500 AND vendor_is_known"
    action: "auto_approve"
  - name: ops_mid
    condition: "amount >= 500 AND amount < 5000"
    action: "route.ops_manager"
  - name: cfo_large
    condition: "amount >= 5000"
    action: "route.cfo"
  - name: new_vendor_any_amount
    condition: "NOT vendor_is_known"
    action: "flag.human_review"
thresholds:
  confidence_min: 0.85
  new_vendor_lookback_days: 180
